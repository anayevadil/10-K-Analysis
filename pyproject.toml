[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenk"
version = "0.1.0"
description = "10-K analyzer: company overview, three-statement model and news sentiment from free SEC data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "xlsxwriter>=3.1",
    "requests>=2.31",
    "streamlit>=1.50",
    "anthropic>=1.11",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# FinBERT headline scoring. Large (PyTorch); the app works without it.
finbert = [
    "transformers>=4.40",
    "torch>=2.2",
]
dev = [
    "openpyxl>=3.1",
    "pytest>=8",
    "responses>=0.25",
    "ruff==0.16.10",  # pinned so local and CI formatting agree
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tenk = ["demo_cache/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not eval'"
markers = ["eval: agent eval set; calls the live Claude API (run with: pytest -m eval)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
