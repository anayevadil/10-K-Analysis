[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenk"
version = "0.1.0"
description = "10-K analyzer: company overview, three-statement model and news sentiment from free SEC data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "xlsxwriter>=3.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "openpyxl>=3.1",
    "pytest>=8",
    "responses>=0.25",
    "ruff==0.16.10",  # pinned so local and CI formatting agree
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
